services:
  - type: web
    name: jumpy-frogy
    runtime: node
    plan: free
    region: oregon
    # --include=dev is required: NODE_ENV=production below makes a bare
    # `npm ci` skip devDependencies, and the build needs tsc and vite.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render sets PORT automatically; keep a fallback for local Docker.
      - key: PORT
        value: 10000
